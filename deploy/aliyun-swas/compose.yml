name: yueji

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: youlai_admin
      MYSQL_USER: yueji
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./yueji-backend/sql/mysql/youlai_admin.sql:/docker-entrypoint-initdb.d/00-youlai_admin.sql:ro
      - ./yueji-backend/sql/mysql/biz_p0.sql:/docker-entrypoint-initdb.d/10-biz_p0.sql:ro
      - ./yueji-backend/sql/mysql/biz_product_catalog.sql:/docker-entrypoint-initdb.d/11-biz_product_catalog.sql:ro
      - ./yueji-backend/sql/mysql/menu_product.sql:/docker-entrypoint-initdb.d/20-menu_product.sql:ro
      - ./yueji-backend/sql/mysql/menu_product_permissions.sql:/docker-entrypoint-initdb.d/21-menu_product_permissions.sql:ro
      - ./yueji-backend/sql/mysql/menu_order.sql:/docker-entrypoint-initdb.d/22-menu_order.sql:ro
      - ./yueji-backend/sql/mysql/menu_member.sql:/docker-entrypoint-initdb.d/23-menu_member.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase4.sql:/docker-entrypoint-initdb.d/30-biz_phase4.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase5.sql:/docker-entrypoint-initdb.d/40-biz_phase5.sql:ro
      - ./yueji-backend/sql/mysql/menu_marketing.sql:/docker-entrypoint-initdb.d/41-menu_marketing.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase6.sql:/docker-entrypoint-initdb.d/50-biz_phase6.sql:ro
      - ./yueji-backend/sql/mysql/menu_appointment.sql:/docker-entrypoint-initdb.d/51-menu_appointment.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase7.sql:/docker-entrypoint-initdb.d/60-biz_phase7.sql:ro
      - ./yueji-backend/sql/mysql/menu_phase7.sql:/docker-entrypoint-initdb.d/61-menu_phase7.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase8_distribution.sql:/docker-entrypoint-initdb.d/70-biz_phase8_distribution.sql:ro
      - ./yueji-backend/sql/mysql/menu_phase8_distribution.sql:/docker-entrypoint-initdb.d/71-menu_phase8_distribution.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase8c_settlement.sql:/docker-entrypoint-initdb.d/72-biz_phase8c_settlement.sql:ro
      - ./yueji-backend/sql/mysql/menu_phase8c_settlement.sql:/docker-entrypoint-initdb.d/73-menu_phase8c_settlement.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase8d_distribution_task.sql:/docker-entrypoint-initdb.d/74-biz_phase8d_distribution_task.sql:ro
      - ./yueji-backend/sql/mysql/menu_phase8d_distribution_task.sql:/docker-entrypoint-initdb.d/75-menu_phase8d_distribution_task.sql:ro
      - ./yueji-backend/sql/mysql/biz_phase8e_sales_analytics.sql:/docker-entrypoint-initdb.d/76-biz_phase8e_sales_analytics.sql:ro
      - ./yueji-backend/sql/mysql/menu_phase8e_sales_analytics.sql:/docker-entrypoint-initdb.d/77-menu_phase8e_sales_analytics.sql:ro
      - ./yueji-backend/sql/mysql/biz_dashboard.sql:/docker-entrypoint-initdb.d/80-biz_dashboard.sql:ro
      - ./yueji-backend/sql/mysql/menu_dashboard.sql:/docker-entrypoint-initdb.d/81-menu_dashboard.sql:ro
      - ./yueji-backend/sql/mysql/menu_cleanup_brand_codegen_docs.sql:/docker-entrypoint-initdb.d/90-menu_cleanup_brand_codegen_docs.sql:ro
      - ./yueji-backend/sql/mysql/menu_hide_system_tools.sql:/docker-entrypoint-initdb.d/91-menu_hide_system_tools.sql:ro
      - ./yueji-backend/sql/mysql/menu_remove_apifox_iframe.sql:/docker-entrypoint-initdb.d/92-menu_remove_apifox_iframe.sql:ro
      - ./yueji-backend/sql/mysql/menu_remove_template_demos.sql:/docker-entrypoint-initdb.d/93-menu_remove_template_demos.sql:ro
      - ./yueji-backend/sql/mysql/menu_fix_mojibake.sql:/docker-entrypoint-initdb.d/94-menu_fix_mojibake.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  redis:
    image: redis@sha256:db485f2e245b5b3329fdc7eff4eb00f913e09d8feb9ca720788059fdc2ed8339
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio@sha256:d786220feef7d8fe0239d41b5d74501dc824f6e7dd0e5a05749c502fff225bf3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"

  admin:
    image: nginx@sha256:0d17b565c37bcbd895e9d92315a05c1c3c9a29f762b011a10c54a66cd53c9b31
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./yueji-oss/dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  redis-data:
  minio-data:
