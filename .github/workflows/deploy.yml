name: Manual Aliyun release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "check: 检查连接 / diagnose: 读取服务状态 / build: 仅构建 / deploy: 发布 / rollback: 恢复上一版"
        type: choice
        options: [check, diagnose, build, deploy, rollback]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: aliyun-production
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' && (inputs.operation == 'build' || inputs.operation == 'deploy')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm run test --runInBand
      - name: Check production dependencies
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
      - name: Build release
        run: pnpm build
      - name: Build database contract and verify migrations
        run: |
          node scripts/database/build-release.cjs
          python3 deploy/aliyun-swas/database-release.py verify-files dist/database-release
          python3 -m unittest discover -s scripts/database -p 'test_*.py' -v
      - name: Test empty database and legacy upgrade
        run: python3 scripts/database/integration.py
      - name: Package release
        run: |
          pnpm prune --prod
          test ! -e dist/application.js
          mv dist/main.js dist/application.js
          cp deploy/aliyun-swas/start.cjs dist/main.js
          tar --hard-dereference -czf release.tgz dist node_modules package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'check' || inputs.operation == 'diagnose' || inputs.operation == 'rollback' ||
       (inputs.operation == 'deploy' && needs.build.result == 'success'))
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          name: release
      - name: Check, deploy or roll back
        shell: bash
        env:
          DEPLOY_HOST: "47.100.53.222"
          DEPLOY_USER: yueji-deploy
          DEPLOY_PORT: "22"
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: "47.100.53.222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILOjx8rsWn+BKd3ASefx9NyZ/xXxLlMQxMzKSPBL4WV9"
          OPERATION: ${{ inputs.operation }}
          COMPONENT: backend
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" == yueji-deploy ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_PORT" -gt 0 && "$DEPLOY_PORT" -le 65535 ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          connection=$(mktemp -d "$RUNNER_TEMP/yueji-ssh.XXXXXXXX")
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$connection/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$connection/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh_options=(-F /dev/null -i "$connection/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$connection/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          if [[ "$OPERATION" == diagnose ]]; then
            ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" \
              "systemctl --no-pager --full status yueji-backend.service; journalctl --no-pager -o cat -u yueji-backend.service -n 200; if [ -r /tmp/yueji-backend-startup-error.log ]; then printf 'STARTUP_ERROR='; cat /tmp/yueji-backend-startup-error.log; fi; if [ -r /tmp/yueji-backend-readiness-error.log ]; then printf 'READINESS_ERROR='; cat /tmp/yueji-backend-readiness-error.log; fi"
            exit 0
          fi
          upload=''
          cleanup() {
            if [[ "$upload" =~ ^/home/yueji-deploy/staging/release\.[A-Za-z0-9]+$ ]]; then
              ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" "rm -rf -- '$upload'" || true
            fi
            rm -rf -- "$connection"
          }
          trap cleanup EXIT
          # An old host script must not silently bypass the new database gate.
          capability=$(ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" \
            "sudo -n /usr/local/sbin/yueji-release 'backend' 'protocol' '' '' ''")
          printf '%s\n' "$capability"
          grep -Fx 'DATABASE_RELEASE_PROTOCOL=1' <<< "$capability" >/dev/null || {
            echo 'Install database release gate v1 on the server before deploying.' >&2
            exit 1
          }
          release=''
          checksum=''
          if [[ "$OPERATION" == deploy ]]; then
            release="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
            checksum=$(sha256sum release.tgz | cut -d ' ' -f 1)
            upload=$(ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" 'mktemp -d /home/yueji-deploy/staging/release.XXXXXXXX')
            [[ "$upload" =~ ^/home/yueji-deploy/staging/release\.[A-Za-z0-9]+$ ]]
            scp "${ssh_options[@]}" -P "$DEPLOY_PORT" release.tgz "$remote:$upload/release.tgz"
          fi
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" \
            "sudo -n /usr/local/sbin/yueji-release '$COMPONENT' '$OPERATION' '$release' '$checksum' '$upload'"
