name: Aliyun release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "check: 检查连接 / deploy: 发布 / rollback: 恢复上一版"
        type: choice
        options: [check, deploy, rollback]
        default: check
        required: true
  push:
    branches: [master]

permissions:
  contents: read

# Set AUTO_DEPLOY=true only after the first manual deployment succeeds.
concurrency:
  group: aliyun-production
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test --runInBand
      - name: Check production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Build release
        run: pnpm build
      - name: Package release
        run: |
          pnpm prune --prod
          tar --hard-dereference -czf release.tgz dist node_modules package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      ((github.event_name == 'workflow_dispatch' &&
        (inputs.operation == 'check' || inputs.operation == 'rollback' || needs.build.result == 'success')) ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true' && needs.build.result == 'success'))
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          name: release
      - name: Validate release script
        run: bash -n deploy/aliyun-swas/release.sh
      - name: Check, deploy or roll back
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
          COMPONENT: backend
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" == root ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_PORT" -gt 0 && "$DEPLOY_PORT" -le 65535 ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          connection=$(mktemp -d "$RUNNER_TEMP/yueji-ssh.XXXXXXXX")
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$connection/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$connection/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh_options=(-F /dev/null -i "$connection/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$connection/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          upload=''
          cleanup() {
            if [[ "$upload" =~ ^/tmp/yueji-ci\.[A-Za-z0-9]+$ ]]; then
              ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" "rm -rf -- '$upload'" || true
            fi
            rm -rf -- "$connection"
          }
          trap cleanup EXIT
          release="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          checksum=''
          if [[ "$OPERATION" == deploy ]]; then
            checksum=$(sha256sum release.tgz | cut -d ' ' -f 1)
            upload=$(ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" 'mktemp -d /tmp/yueji-ci.XXXXXXXX')
            [[ "$upload" =~ ^/tmp/yueji-ci\.[A-Za-z0-9]+$ ]]
            scp "${ssh_options[@]}" -P "$DEPLOY_PORT" release.tgz "$remote:$upload/release.tgz"
          fi
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$remote" \
            "bash -s -- '$COMPONENT' '$OPERATION' '$release' '$checksum' '$upload'" < deploy/aliyun-swas/release.sh
