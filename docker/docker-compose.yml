# 有来后台管理系统(Nest.js) Docker Compose 配置
# 使用方法：在 docker 目录下执行 docker-compose up -d

networks:
  youlai-nest:
    driver: bridge

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: youlai-nest-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
      # 仅在数据目录为空时按文件名顺序初始化阶段 0–5。
      - ../sql/mysql/youlai_admin.sql:/docker-entrypoint-initdb.d/00-youlai_admin.sql:ro
      - ../sql/mysql/biz_p0.sql:/docker-entrypoint-initdb.d/10-biz_p0.sql:ro
      - ../sql/mysql/menu_product.sql:/docker-entrypoint-initdb.d/20-menu_product.sql:ro
      - ../sql/mysql/menu_product_permissions.sql:/docker-entrypoint-initdb.d/25-menu_product_permissions.sql:ro
      - ../sql/mysql/menu_order.sql:/docker-entrypoint-initdb.d/30-menu_order.sql:ro
      - ../sql/mysql/menu_member.sql:/docker-entrypoint-initdb.d/40-menu_member.sql:ro
      - ../sql/mysql/biz_phase4.sql:/docker-entrypoint-initdb.d/50-biz_phase4.sql:ro
      - ../sql/mysql/biz_phase5.sql:/docker-entrypoint-initdb.d/60-biz_phase5.sql:ro
      - ../sql/mysql/menu_marketing.sql:/docker-entrypoint-initdb.d/70-menu_marketing.sql:ro
    ports:
      - 3306:3306
    networks:
      - youlai-nest
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7.2.3
    container_name: youlai-nest-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456 --appendonly no
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/data:/data
    ports:
      - 6379:6379
    networks:
      - youlai-nest

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: youlai-nest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - TZ=Asia/Shanghai
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - youlai-nest
